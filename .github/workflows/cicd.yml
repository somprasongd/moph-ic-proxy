name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Login to GitHub Container Registry
        run: echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ secrets.CR_USERNAME }} --password-stdin
      # push main -> image :latest / push tag vX.Y.Z -> image :X.Y.Z (build จาก commit ที่ tag ชี้)
      # รัน tag ไม่ push latest เพื่อกัน tag เก่าที่ push ทีหลัง overwriting latest ของ main
      - name: Compute image tags
        id: meta
        run: |
          IMAGE="ghcr.io/${{ secrets.CR_USERNAME }}/moph-api-proxy"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "tags=$IMAGE:${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          ARGS=(); for t in "${TAGS[@]}"; do ARGS+=(-t "$t"); done
          docker build "${ARGS[@]}" .
      - name: Push
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.meta.outputs.tags }}"
          for t in "${TAGS[@]}"; do docker image push "$t"; done

  cd:
    runs-on: ubuntu-latest
    needs: ci
    # deploy เฉพาะ push main — push tag เพิ่ง deploy ไปแล้วจาก branch run
    if: github.ref_type == 'branch'
    steps:
      - name: executing remote ssh commands
        uses: appleboy/ssh-action@v1.2.5
        env:
          CR_USERNAME: ${{ secrets.CR_USERNAME }}
          CR_PAT: ${{ secrets.CR_PAT }}
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_SERVER_KEY }}
          port: ${{ secrets.DEV_SERVER_PORT }}
          envs: CR_USERNAME,CR_PAT
          script: |
            echo "$CR_PAT" | docker login ghcr.io -u "$CR_USERNAME" --password-stdin
            cd docker-apps/moph-api-proxy
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d moph-api-proxy
